</div>

<script>
    function selectStage(button) {
      const chips = document.querySelectorAll('.stage-chip');
      chips.forEach(chip => {
        chip.className = 'stage-chip text-xs font-medium px-3 py-1.5 rounded-full border border-[#EAE4E7] bg-white text-[#6F6870] hover:border-[#F2CADD] hover:text-[#29252B] transition-colors';
      });
      button.className = 'stage-chip text-xs font-medium px-3 py-1.5 rounded-full border border-[#F2CADD] bg-[#F8E7EF] text-[#29252B] transition-colors';
    }

    function togglePassVisibility() {
      const pwdInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-btn');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.innerText = 'Hide';
      } else {
        pwdInput.type = 'password';
        toggleBtn.innerText = 'Show';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      const errorDiv = document.getElementById('signup-error');
      const submitBtn = document.getElementById('submitBtn');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errorDiv.classList.add('hidden');
          errorDiv.textContent = '';

          const name = document.getElementById('fullName').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          const companyWebsite = document.getElementById('company_website')?.value || '';

          if (!name) {
            errorDiv.textContent = 'Please enter your full name.';
            errorDiv.classList.remove('hidden');
            return;
          }
          if (!email) {
            errorDiv.textContent = 'Please enter a valid email address.';
            errorDiv.classList.remove('hidden');
            return;
          }
          if (!password || password.length < 8) {
            errorDiv.textContent = 'Password must be at least 8 characters long.';
            errorDiv.classList.remove('hidden');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';

          try {
            if (window.MamaAPI && window.MamaAPI.auth) {
              await window.MamaAPI.auth.register({ name, email, password, company_website: companyWebsite });
            } else {
              localStorage.setItem('userName', name);
              localStorage.setItem('mama_user', JSON.stringify({ name, email }));
            }
            window.location.href = 'home.html';
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create account';
            errorDiv.textContent = err.message || 'Account creation failed. Please try again.';
            errorDiv.classList.remove('hidden');
          }
        });
      }
    });
  </script>
