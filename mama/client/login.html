<script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('toggleIcon');
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const errorDiv = document.getElementById('login-error');
      const submitBtn = document.getElementById('loginSubmitBtn');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errorDiv.classList.add('hidden');
          errorDiv.textContent = '';

          const email = document.getElementById('identifier').value.trim();
          const password = document.getElementById('password').value;

          if (!email) {
            errorDiv.textContent = 'Please enter your email or phone number.';
            errorDiv.classList.remove('hidden');
            return;
          }
          if (!password) {
            errorDiv.textContent = 'Please enter your password.';
            errorDiv.classList.remove('hidden');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';

          try {
            if (window.MamaAPI && window.MamaAPI.auth) {
              await window.MamaAPI.auth.login(email, password);
            } else {
              localStorage.setItem('mama_user', JSON.stringify({ email }));
            }
            window.location.href = 'home.html';
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign in';
            errorDiv.textContent = err.message || 'Sign in failed. Please check your credentials.';
            errorDiv.classList.remove('hidden');
          }
        });
      }
    });
  </script>
